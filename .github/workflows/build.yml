name: florida-zygisk Build

on:
  schedule:
    - cron: "0 12 * * MON"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Force rebuild even if release already exists"
        required: false
        default: "false"
      frida_version:
        description: "Override frida version (e.g. 17.9.6). Leave empty to use latest."
        required: false
        default: ""
  push:
    branches: ["main", "ci"]
    paths:
      - ".github/workflows/build.yml"

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Determine what needs to be built
  # ─────────────────────────────────────────────────────────────────────────────
  check_version:
    name: Check versions
    runs-on: ubuntu-22.04

    outputs:
      FRIDA_VERSION: ${{ steps.frida.outputs.version }}
      MAGISK_FRIDA_TAG: ${{ steps.magisk_frida.outputs.tag }}
      FLORIDA_PATCHES_SHA: ${{ steps.florida_sha.outputs.sha }}
      RELEASE_TAG: ${{ steps.compute_tag.outputs.tag }}
      SHOULD_BUILD: ${{ steps.should_build.outputs.result }}

    steps:
      - name: Get latest frida release
        id: frida
        uses: actions/github-script@v7
        with:
          script: |
            const override = '${{ github.event.inputs.frida_version }}';
            if (override && override.trim() !== '') {
              core.setOutput('version', override.trim());
              core.info(`Using overridden frida version: ${override.trim()}`);
              return;
            }
            const { data } = await github.rest.repos.getLatestRelease({
              owner: 'frida',
              repo: 'frida',
            });
            core.setOutput('version', data.tag_name);
            core.info(`Latest frida version: ${data.tag_name}`);

      - name: Get latest magisk-frida release
        id: magisk_frida
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.getLatestRelease({
              owner: 'ViRb3',
              repo: 'magisk-frida',
            });
            core.setOutput('tag', data.tag_name);
            core.info(`Latest magisk-frida tag: ${data.tag_name}`);

      - name: Get Florida patches HEAD SHA
        id: florida_sha
        run: |
          SHA=$(git ls-remote https://github.com/Ylarod/Florida.git HEAD | cut -f1 | cut -c1-8)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Florida patches SHA: $SHA"

      - name: Compute our release tag
        id: compute_tag
        run: |
          # Format: FRIDA_VERSION (we track frida version directly)
          TAG="${{ steps.frida.outputs.version }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Computed release tag: $TAG"

      - name: Check if release already exists
        id: should_build
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const tag = '${{ steps.compute_tag.outputs.tag }}';
            const forceRebuild = '${{ github.event.inputs.force_rebuild }}' === 'true';
            const isPush = '${{ github.event_name }}' === 'push';
            const isManual = '${{ github.event_name }}' === 'workflow_dispatch';

            if (forceRebuild || isPush || isManual) {
              core.info('Force rebuild, push, or manual run – will build.');
              return 'true';
            }

            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              core.info(`Release ${tag} already exists – skipping.`);
              return 'false';
            } catch (e) {
              if (e.status === 404) {
                core.info(`Release ${tag} not found – will build.`);
                return 'true';
              } else {
                throw e;
              }
            }

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Build Florida frida-server for each Android architecture
  # ─────────────────────────────────────────────────────────────────────────────
  build_florida:
    name: Build Florida (${{ matrix.arch }})
    needs: check_version
    if: needs.check_version.outputs.SHOULD_BUILD == 'true'
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false # let other arches continue if one fails
      matrix:
        arch: [android-arm, android-arm64, android-x86, android-x86_64]

    steps:
      - name: Checkout our repo (for any local patches)
        uses: actions/checkout@v4

      - name: Install system build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential ninja-build \
            gcc-multilib g++-multilib \
            lib32stdc++6 \
            flex bison \
            ruby ruby-dev \
            python3-requests python3-setuptools python3-dev python3-pip \
            libc6-dev libc6-dev-i386 \
            tree curl git
          sudo gem install fpm -v 1.11.0 --no-document 2>/dev/null || true
          # NOTE: lief is intentionally NOT installed here. It must go into the
          # same Python interpreter frida's build actually uses (setup-python
          # 3.10 below); installing it into the system Python here was the root
          # cause of issue #1 ("Failed to spawn: undefined symbol: main").

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          local-cache: false  # avoid stale/partial cache extractions
          link-to-sdk: true

      - name: Ensure NDK clang symlinks exist
        run: |
          # NDK r29 stable ships versioned binaries (clang-21, clang++-21) but
          # drops the plain 'clang' symlink that frida's meson cross-file expects.
          BIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          for TOOL in clang clang++ lld llvm-ar llvm-strip; do
            if [ ! -e "$BIN/$TOOL" ]; then
              VERSIONED=$(ls "$BIN/$TOOL-"* 2>/dev/null | sort -V | tail -1)
              if [ -n "$VERSIONED" ]; then
                ln -sf "$(basename "$VERSIONED")" "$BIN/$TOOL"
                echo "Linked $TOOL -> $(basename "$VERSIONED")"
              fi
            fi
          done
          echo "NDK clang: $("$BIN/clang" --version 2>/dev/null | head -1 || echo 'NOT FOUND – build will fail')"

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install lief for Florida's anti-anti-frida.py (REQUIRED)
        # lief renames the frida_agent_main symbol -> "main" in the built agent.
        # It MUST live in the same interpreter frida's build uses (this Python
        # 3.10). Previously it was installed into the system Python, so the rename
        # was silently skipped and frida-server failed with
        # "Failed to spawn: undefined symbol: main" (issue #1).
        run: |
          python3 -m pip install "lief==0.13.12"
          python3 -c "import lief; assert hasattr(lief, 'parse'); print('lief', lief.__version__)"

      - name: Cache frida clone
        uses: actions/cache@v4
        id: cache-frida
        with:
          # Cache the full frida source tree (submodules included) by frida version +
          # Florida patches SHA so a patches change always triggers a fresh clone.
          # The `-v2` marker busts caches poisoned by earlier failed runs that used
          # the old --reject/--skip patch logic (which left a partially-patched tree).
          # Bump it whenever the patch/carry logic changes in a way that needs a
          # clean re-clone.
          path: frida
          key: frida-src-v2-${{ needs.check_version.outputs.FRIDA_VERSION }}-${{ needs.check_version.outputs.FLORIDA_PATCHES_SHA }}

      - name: Clone frida at target version
        if: steps.cache-frida.outputs.cache-hit != 'true'
        env:
          FRIDA_VERSION: ${{ needs.check_version.outputs.FRIDA_VERSION }}
        run: |
          echo "Cloning frida $FRIDA_VERSION …"
          git clone \
            --depth 1 \
            --branch "$FRIDA_VERSION" \
            --recurse-submodules \
            --shallow-submodules \
            https://github.com/frida/frida

      - name: Clone Florida (patches only)
        env:
          FLORIDA_SHA: ${{ needs.check_version.outputs.FLORIDA_PATCHES_SHA }}
        run: |
          echo "Cloning Florida patches …"
          git clone --depth 1 https://github.com/Ylarod/Florida florida-repo

      - name: Apply Florida patches to frida subprojects
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          PATCH_BASE="$(pwd)/florida-repo/patches"

          if [ ! -d "$PATCH_BASE" ]; then
            echo "ERROR: patches directory not found in Florida repo!"
            ls florida-repo/
            exit 1
          fi

          echo "Available patch directories:"
          ls "$PATCH_BASE"

          cd frida
          FRIDA_ROOT="$(pwd)"
          shopt -s nullglob
          for patch_dir in "$PATCH_BASE"/*/; do
            subproject=$(basename "$patch_dir")
            target="subprojects/$subproject"

            if [ ! -d "$target" ]; then
              echo "SKIP: subproject '$subproject' not found in frida tree"
              continue
            fi

            patches=("$patch_dir"*.patch)
            if [ "${#patches[@]}" -eq 0 ]; then
              echo "SKIP: no .patch files in $patch_dir"
              continue
            fi

            echo "==> $subproject: ${#patches[@]} patch(es)"
            cd "$FRIDA_ROOT/$target"
            applied=0; skipped=0
            for patch in "${patches[@]}"; do
              pname="$(basename "$patch")"
              # STRICT per-patch application: a patch applies WHOLLY or is skipped
              # WHOLLY. We deliberately do NOT use --reject/--skip here — that used
              # to apply hunks partially and ship inconsistent source trees, which
              # is exactly what caused the getRpcStr-undefined CI break and the
              # "undefined symbol: main" runtime error (issue #1). Bit-rotted
              # patches that get skipped are repaired by scripts/florida_carry.py.
              if git am --ignore-whitespace "$patch"; then
                echo "    ✓ applied: $pname"
                applied=$((applied + 1))
              else
                git am --abort 2>/dev/null || true
                echo "    ✗ SKIPPED (bit-rotted): $pname — carry-fixes will repair"
                skipped=$((skipped + 1))
              fi
            done
            echo "    $subproject summary: $applied applied, $skipped skipped"
            cd "$FRIDA_ROOT"
          done
          echo "Florida patch application complete (see per-patch log above)."

      - name: Apply florida-zygisk carry-fixes
        # Repair bit-rotted/skipped Florida patches with idempotent,
        # content-anchored fixes. Each fix is a no-op once Florida fixes upstream.
        # The script also fails fast (sys.exit) if a patch landed unrecoverably
        # inconsistent — e.g. getRpcStr used-but-undefined, or a missing anchor.
        run: |
          cd frida
          python3 "$GITHUB_WORKSPACE/scripts/florida_carry.py"

      - name: Build frida-server for ${{ matrix.arch }}
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ARCH: ${{ matrix.arch }}
          # Absolute path to Florida's anti-anti-frida.py for the carry hook in
          # embed-agent.py (renames frida_agent_main -> main). github.workspace
          # is trusted (GitHub-controlled), so this is safe to inline.
          FLORIDA_ANTI_ANTI_FRIDA: ${{ github.workspace }}/frida/subprojects/frida-core/src/anti-anti-frida.py
        run: |
          echo "Building frida for $ARCH …"
          echo "NDK: $ANDROID_NDK_ROOT"

          mkdir -p "build-$ARCH"
          cd "build-$ARCH"

          # Configure (frida uses its own configure wrapper around meson)
          ../frida/configure --host="$ARCH"

          # Build only frida-server to save time/disk
          make subprojects/frida-core/server/frida-server

      - name: Verify Florida patches took effect in built binary
        # The hard guard against issue #1: if anti-anti-frida.py never ran, the
        # embedded agent still exports `frida_agent_main` while the server looks
        # up `main` -> "Failed to spawn: undefined symbol: main". Fail loudly
        # instead of shipping a broken binary. Also confirms rpc obfuscation.
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          SERVER="build-$ARCH/subprojects/frida-core/server/frida-server"
          if [ ! -f "$SERVER" ]; then
            echo "ERROR: frida-server not found at $SERVER"
            find "build-$ARCH" -name "frida-server" 2>/dev/null || true
            exit 1
          fi
          echo "Built: $(file "$SERVER")"

          main_sym=$(strings -a "$SERVER" | grep -c "frida_agent_main" || true)
          rpc=$(strings -a "$SERVER" | grep -c "frida:rpc" || true)
          echo "frida_agent_main occurrences: $main_sym  (MUST be 0)"
          echo "frida:rpc occurrences:        $rpc  (should be 0)"

          if [ "$main_sym" -ne 0 ]; then
            echo "::error::Agent symbol rename (anti-anti-frida.py) did NOT run. This binary would fail with 'Failed to spawn: undefined symbol: main' (issue #1). Refusing to ship."
            exit 1
          fi
          if [ "$rpc" -ne 0 ]; then
            echo "::warning::rpc string obfuscation appears absent ('frida:rpc' literal still present). Anti-detection is weakened but the binary is functional."
          fi
          echo "OK: Florida anti-detection patches verified effective in $SERVER"

      - name: Compress frida-server binary
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          SERVER_PATH="build-$ARCH/subprojects/frida-core/server/frida-server"
          if [ ! -f "$SERVER_PATH" ]; then
            echo "ERROR: frida-server not found at $SERVER_PATH"
            find "build-$ARCH" -name "frida-server" 2>/dev/null || true
            exit 1
          fi

          # Compress with gzip (matching Florida's release format)
          cp "$SERVER_PATH" "frida-server-$ARCH"
          gzip -9 "frida-server-$ARCH"
          echo "Compressed: frida-server-$ARCH.gz ($(du -sh "frida-server-$ARCH.gz" | cut -f1))"

      - name: Upload arch artifact
        uses: actions/upload-artifact@v4
        with:
          name: florida-server-${{ matrix.arch }}
          path: frida-server-${{ matrix.arch }}.gz
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Package all 4 arches into a Magisk module ZIP and publish a release
  # ─────────────────────────────────────────────────────────────────────────────
  package_and_release:
    name: Package Magisk module & release
    needs: [check_version, build_florida]
    if: needs.check_version.outputs.SHOULD_BUILD == 'true'
    runs-on: ubuntu-22.04

    permissions:
      contents: write # needed to create releases

    steps:
      - name: Checkout our repo
        uses: actions/checkout@v4

      - name: Download all arch artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: florida-server-*
          path: downloads/
          merge-multiple: true

      - name: Verify downloaded artifacts
        run: |
          echo "Downloaded artifacts:"
          ls -lh downloads/
          for arch in android-arm android-arm64 android-x86 android-x86_64; do
            f="downloads/frida-server-$arch.gz"
            if [ ! -f "$f" ]; then
              echo "ERROR: missing $f"
              exit 1
            fi
          done
          echo "All 4 arch binaries present."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: pip install requests

      - name: Build Magisk module ZIP
        env:
          FRIDA_VERSION: ${{ needs.check_version.outputs.FRIDA_VERSION }}
          MAGISK_FRIDA_TAG: ${{ needs.check_version.outputs.MAGISK_FRIDA_TAG }}
          FLORIDA_SHA: ${{ needs.check_version.outputs.FLORIDA_PATCHES_SHA }}
          RELEASE_TAG: ${{ needs.check_version.outputs.RELEASE_TAG }}
          GITHUB_REPO: ${{ github.repository }}
        run: python3 build.py

      - name: List build output
        run: |
          echo "Build directory contents:"
          ls -lh build/

      - name: Delete existing release if force-rebuilding
        if: github.event.inputs.force_rebuild == 'true'
        uses: actions/github-script@v7
        continue-on-error: true # fails gracefully if release doesn't exist
        with:
          script: |
            const tag = '${{ needs.check_version.outputs.RELEASE_TAG }}';
            try {
              const rel = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: rel.data.id,
              });
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
              core.info(`Deleted existing release and tag: ${tag}`);
            } catch (e) {
              core.info(`No existing release to delete: ${e.message}`);
            }

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check_version.outputs.RELEASE_TAG }}
          name: "florida-zygisk (Florida) ${{ needs.check_version.outputs.RELEASE_TAG }}"
          body: |
            ## florida-zygisk – Florida frida-server on Boot

            Magisk module wrapping **[Florida](https://github.com/Ylarod/Florida)** (anti-detection frida-server)
            packaged in the **[magisk-frida](https://github.com/ViRb3/magisk-frida)** module format.

            | Component | Version |
            |-----------|---------|
            | frida / Florida | `${{ needs.check_version.outputs.FRIDA_VERSION }}` |
            | magisk-frida template | `${{ needs.check_version.outputs.MAGISK_FRIDA_TAG }}` |
            | Florida patches SHA | `${{ needs.check_version.outputs.FLORIDA_PATCHES_SHA }}` |

            ### Installation
            Flash `florida-zygisk-*.zip` via Magisk / KSU / APatch.
            Architectures included: `arm`, `arm64`, `x86`, `x86_64`.

            ### How it works
            Florida's patches are applied to the frida source tree and compiled from scratch
            (we do not depend on Florida's CI, which has been unreliable).
          files: |
            build/florida-zygisk-*.zip
            build/updater.json
            downloads/frida-server-*.gz
          fail_on_unmatched_files: true
          make_latest: true
